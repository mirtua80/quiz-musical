function decadeOf(year){ const y=parseInt(year,10); if(y<1980)return"70"; if(y<1990)return"80"; if(y<2000)return"90"; if(y<2010)return"00"; if(y<2020)return"10"; return"20"; }
function decadeLabel(c){ return {"70":"70s","80":"80s","90":"90s","00":"2000s","10":"2010s","20":"2020s"}[c]; }
function makeRoomCode(){ const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<4;i++)c+=chars[Math.floor(Math.random()*chars.length)]; return c; }
function normalize(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim(); }
function extractYoutubeId(input){
  if (!input) return null;
  const s = input.trim();
  // Ya es un ID "puro" (11 caracteres típicos de YouTube)
  if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
  ];
  for (const re of patterns) { const m = s.match(re); if (m) return m[1]; }
  return null;
}
function youtubeSearchUrl(title, artist){
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' ' + artist)}`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function scoreQuizGuess({guessYear,guessArtist,correctYear,correctArtist}){
  let points=0; const diff=Math.abs(parseInt(guessYear,10)-parseInt(correctYear,10));
  points+=Math.max(0,100-diff*15);
  let artistCorrect=false;
  if(guessArtist && correctArtist){ const g=normalize(guessArtist), c=normalize(correctArtist); artistCorrect = g.length>0 && (c.includes(g)||g.includes(c)); if(artistCorrect) points+=50; }
  return {points, artistCorrect, yearDiff:diff};
}
function generateBingoCard(tracklist,size=9){
  const shuffled=[...tracklist].sort(()=>Math.random()-0.5);
  return shuffled.slice(0,size).map(t=>({trackId:t.id,title:t.title,artist:t.artist,year:t.year,marked:false}));
}
function checkBingoLine(cells){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return lines.some(line=>line.every(i=>cells[i]&&cells[i].marked));
}

      </div>
      <footer class="hint">Funciona en cualquier móvil con navegador. No hace falta instalar nada.</footer>
    </div>
  </div>`;

  document.getElementById('hostBtn').addEventListener('click', () => {
    location.search = '?host=1';
  });
  document.getElementById('joinBtn').addEventListener('click', () => {
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    const name = document.getElementById('joinName').value.trim();
    if (code.length !== 4) { alert('El código de sala tiene 4 caracteres.'); return; }
    if (!name) { alert('Escribe tu nombre.'); return; }
    location.search = `?room=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
  });
}

  const $ = id => document.getElementById(id);

  $('loadDemoBtn').addEventListener('click', () => { $('trackInput').value = generateRandomDemoTracks($('demoCategory').value, 20); updateTrackCount(); });
  $('trackInput').addEventListener('input', updateTrackCount);
  function parseTracks(text){
    return text.split('\n').map(l=>l.trim()).filter(Boolean).map((line,i)=>{
      const [title,artist,year,youtube] = line.split(';').map(s=>(s||'').trim());
      if(!title||!artist||!year) return null;
      return {id:'t'+i, title, artist, year:parseInt(year,10), decade:decadeOf(year), used:false, youtubeId: extractYoutubeId(youtube)};

  }
  function updateTrackCount(){ $('trackCount').textContent = `${parseTracks($('trackInput').value).length} canciones`; }

  $('createRoomBtn').addEventListener('click', async () => {

    await authReady;
    const code = makeRoomCode();
    state.roomCode = code; state.tracks = tracks;
    const roomRef = db.collection('rooms').doc(code);
    await roomRef.set({ status:'lobby', mode:'quiz', currentTrackId:null, roundNumber:0, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    const batch = db.batch();
    tracks.forEach(t => batch.set(roomRef.collection('tracks').doc(t.id), t));
    await batch.commit();
    $('lobbyCode').textContent = code;
    localStorage.setItem('lastHostRoom', code);
    $('setupScreen').style.display='none'; $('lobbyScreen').style.display='flex';

  // ---------- Reconectar como anfitrión a una sala ya creada ----------
  async function resumeRoom(code){
    await authReady;
    const roomRef = db.collection('rooms').doc(code);
    const roomSnap = await roomRef.get();
    if (!roomSnap.exists) return false;
    const room = roomSnap.data();

    const tracksSnap = await roomRef.collection('tracks').get();
    state.roomCode = code;
    state.tracks = [];
    tracksSnap.forEach(d => state.tracks.push(d.data()));
    state.mode = room.mode || 'quiz';
    state.roundNumber = room.roundNumber || 0;
    state.currentTrackId = room.currentTrackId || null;
    localStorage.setItem('lastHostRoom', code);

    if (room.status === 'finished') {
      const playersSnap = await roomRef.collection('players').get();
      const players = []; playersSnap.forEach(d => players.push(d.data()));
      players.sort((a,b)=>(b.score||0)-(a.score||0));
      const medals=['🥇','🥈','🥉'];
      $('finalPodium').innerHTML = players.map((p,i)=>`<li><span class="rank">${medals[i]||(i+1)}</span><span class="name">${escapeHtml(p.name)}</span><span class="score">${p.score||0}</span></li>`).join('');
      $('setupScreen').style.display='none'; $('finishScreen').style.display='flex';
      return true;
    }

    if (room.status === 'lobby') {
      $('lobbyCode').textContent = code;
      $('setupScreen').style.display='none'; $('lobbyScreen').style.display='flex';
      listenLobbyPlayers();
      return true;
    }

    // status: 'playing' o 'reveal' → directamente a la partida en curso
    $('setupScreen').style.display='none'; $('gameScreen').style.display='flex';
    $('roomPill').textContent = `Sala ${state.roomCode}`;
    document.querySelector(`input[name=modeSelGame][value=${state.mode}]`).checked = true;
    updateModeBadge(state.mode);
    renderTrackPicker();
    listenGamePlayers();

    if (room.status === 'playing' && state.currentTrackId) {
      const track = state.tracks.find(t => t.id === state.currentTrackId);
      if (track) {
        $('roundControlCard').style.display='none'; $('playingCard').style.display='flex';
        $('nowPlayingTitle').textContent = `${track.title} — ${track.artist}`;
        $('nowPlayingYear').textContent = `Año: ${track.year}`;
        renderYoutubeBox(track);
        lightDial(null);
        listenAnswerCount();
      }
    }
    return true;
  }

  document.getElementById('reconnectBtn').addEventListener('click', async () => {
    const code = document.getElementById('reconnectCode').value.trim().toUpperCase();
    if (code.length !== 4) { alert('El código de sala tiene 4 caracteres.'); return; }
    const ok = await resumeRoom(code);
    if (!ok) { document.getElementById('reconnectError').style.display = 'block'; }
  });

  // Si el navegador recuerda una sala creada anteriormente, ofrece continuarla
  (async () => {
    const lastCode = localStorage.getItem('lastHostRoom');
    if (!lastCode) return;
    await authReady;
    const roomSnap = await db.collection('rooms').doc(lastCode).get();
    if (roomSnap.exists && roomSnap.data().status !== 'finished') {
      $('resumeText').textContent = `Tienes la sala ${lastCode} abierta (estado: ${roomSnap.data().status}).`;
      $('resumeCard').style.display = 'flex';
      $('resumeBtn').addEventListener('click', () => resumeRoom(lastCode));
    } else {
      localStorage.removeItem('lastHostRoom');
    }
  })();

  function listenLobbyPlayers(){
    db.collection('rooms').doc(state.roomCode).collection('players').onSnapshot(snap=>{
      const players=[]; snap.forEach(d=>players.push({id:d.id,...d.data()}));
      $('playerCountPill').textContent = players.length;
      $('lobbyPlayerList').innerHTML = players.map(p=>`<li><span class="name">${escapeHtml(p.name)}</span></li>`).join('') || '<li style="color:var(--ink-dim);">Esperando jugadores…</li>';
    });
  }

  $('startGameBtn').addEventListener('click', async () => {
    const mode = document.querySelector('input[name=modeSel]:checked').value;
    state.mode = mode;
    await db.collection('rooms').doc(state.roomCode).update({ mode, status:'lobby' });
    if (mode==='bingo') await generateAllBingoCards();
    $('lobbyScreen').style.display='none'; $('gameScreen').style.display='flex';
    $('roomPill').textContent = `Sala ${state.roomCode}`;
    document.querySelector(`input[name=modeSelGame][value=${mode}]`).checked = true;
    updateModeBadge(mode); renderTrackPicker(); listenGamePlayers();
  });

  async function generateAllBingoCards(){
    const roomRef = db.collection('rooms').doc(state.roomCode);
    const playersSnap = await roomRef.collection('players').get();
    const batch = db.batch();
    playersSnap.forEach(doc => { const card = generateBingoCard(state.tracks,9); batch.update(doc.ref,{card, score:0}); });
    await batch.commit();
  }

  document.addEventListener('change', async (e) => {
    if (e.target.name === 'modeSelGame') {
      state.mode = e.target.value;
      updateModeBadge(state.mode);
      await db.collection('rooms').doc(state.roomCode).update({ mode: state.mode });
      if (state.mode === 'bingo') await generateAllBingoCards();
    }
  });

  function updateModeBadge(mode){ const b=$('modeBadge'); b.textContent = mode==='quiz'?'QUIZ':'BINGO'; b.className='badge-mode '+(mode==='quiz'?'badge-quiz':'badge-bingo'); }

  function renderTrackPicker(){
    const pending = state.tracks.filter(t=>!t.used);
    $('trackPickerList').innerHTML = pending.map(t=>`<li data-id="${t.id}"><span>${escapeHtml(t.title)} — ${escapeHtml(t.artist)}</span><span class="yr">${t.year}</span></li>`).join('') || '<li style="color:var(--ink-dim);">No quedan canciones.</li>';
    $('trackPickerList').querySelectorAll('li[data-id]').forEach(li=>{
      li.addEventListener('click', () => {
        $('trackPickerList').querySelectorAll('li').forEach(x=>x.classList.remove('current'));
        li.classList.add('current');
        state.currentTrackId = li.dataset.id;
        $('startRoundBtn').disabled = false;
      });
    });
  }

  $('startRoundBtn').addEventListener('click', async () => {
    const track = state.tracks.find(t=>t.id===state.currentTrackId);
    if (!track) return;
    track.used = true; state.roundNumber += 1;
    await db.collection('rooms').doc(state.roomCode).update({
      status:'playing', currentTrackId:track.id,
      currentTrack:{title:track.title, artist:track.artist, year:track.year, decade:track.decade},
      roundNumber: state.roundNumber,
    });
    await db.collection('rooms').doc(state.roomCode).collection('tracks').doc(track.id).update({used:true});
    $('roundControlCard').style.display='none'; $('playingCard').style.display='flex';
    $('nowPlayingTitle').textContent = `${track.title} — ${track.artist}`;
    $('nowPlayingYear').textContent = `Año: ${track.year}`;
    renderYoutubeBox(track);
    lightDial(null); listenAnswerCount();
  });

  function renderYoutubeBox(track){
    const box = $('youtubePlayerBox');
    if (track.youtubeId) {
      box.innerHTML = `
        <div style="position:relative;width:100%;padding-top:56.25%;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);">
          <iframe src="https://www.youtube.com/embed/${track.youtubeId}?autoplay=1&rel=0"
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
            allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>`;
    } else {
      const url = youtubeSearchUrl(track.title, track.artist);
      box.innerHTML = `
        <a href="${url}" target="_blank" rel="noopener">
          <button class="btn-block" style="background:#ff0000;color:#fff;border-color:transparent;">▶ Buscar "${escapeHtml(track.title)}" en YouTube</button>
        </a>
        <p style="color:var(--ink-dim);font-size:12px;text-align:center;margin-top:6px;">Se abre en pestaña nueva. Tip: añade el enlace del vídeo como 4º campo (Título;Artista;Año;URL) para que la próxima vez se reproduzca aquí mismo.</p>`;
    }
  }

  function listenAnswerCount(){
    if (state.unsubAnswers) state.unsubAnswers();
    state.unsubAnswers = db.collection('rooms').doc(state.roomCode).collection('answers')
      .where('roundNumber','==',state.roundNumber)
      .onSnapshot(snap => { $('answerCountLine').textContent = `${snap.size} respuestas recibidas`; });
  }

  $('revealBtn').addEventListener('click', async () => {
    const track = state.tracks.find(t=>t.id===state.currentTrackId);
    await db.collection('rooms').doc(state.roomCode).update({ status:'reveal' });
    $('revealTitle').textContent = `${track.title} — ${track.artist}`;
    $('revealMeta').textContent = `Año: ${track.year} · Década ${decadeLabel(track.decade)}`;
    lightDial(track.decade);
    let results = state.mode==='quiz' ? await scoreQuizRound(track) : await scoreBingoRound(track);
    $('roundResultsList').innerHTML = results.map(r=>`<li><span class="name">${escapeHtml(r.name)}</span><span class="score">${r.points>0?'+':''}${r.points}</span></li>`).join('') || '<li style="color:var(--ink-dim);">Nadie ha respondido esta ronda.</li>';
    $('playingCard').style.display='none'; $('revealCard').style.display='flex';
    $('youtubePlayerBox').innerHTML = ''; // detiene el vídeo embebido al revelar
  });

  async function scoreQuizRound(track){
    const roomRef = db.collection('rooms').doc(state.roomCode);
    const answersSnap = await roomRef.collection('answers').where('roundNumber','==',state.roundNumber).get();
    const results = []; const batch = db.batch();
    for (const doc of answersSnap.docs) {
      const a = doc.data();
      const { points } = scoreQuizGuess({ guessYear:a.guessYear, guessArtist:a.guessArtist, correctYear:track.year, correctArtist:track.artist });
      results.push({ name:a.playerName, points });
      batch.update(doc.ref, { points, scored:true });
      batch.update(roomRef.collection('players').doc(a.playerId), { score: firebase.firestore.FieldValue.increment(points) });
    }
    await batch.commit();
    return results.sort((a,b)=>b.points-a.points);
  }

  async function scoreBingoRound(track){
    const roomRef = db.collection('rooms').doc(state.roomCode);
    const playersSnap = await roomRef.collection('players').get();
    const results = [];
    playersSnap.forEach(doc => {
      const p = doc.data();
      const hit = (p.card||[]).find(c=>c.trackId===track.id && c.marked);
      if (hit) results.push({ name:p.name, points:20 });
    });
    return results;
  }

  $('nextRoundBtn').addEventListener('click', () => {
    $('revealCard').style.display='none'; $('roundControlCard').style.display='flex';
    $('startRoundBtn').disabled = true; state.currentTrackId = null; renderTrackPicker();
  });

  function lightDial(decade){
    document.querySelectorAll('#gameDial .tick').forEach(t => t.classList.toggle('lit', decade ? t.dataset.d===decade : false));
  }

  function listenGamePlayers(){
    if (state.unsubPlayers) state.unsubPlayers();
    state.unsubPlayers = db.collection('rooms').doc(state.roomCode).collection('players').onSnapshot(snap=>{
      const players=[]; snap.forEach(d=>players.push({id:d.id,...d.data()}));
      players.sort((a,b)=>(b.score||0)-(a.score||0));
      $('liveScoreboard').innerHTML = players.map((p,i)=>`<li><span class="rank">${i+1}</span><span class="name">${escapeHtml(p.name)}</span><span class="score">${p.score||0}</span></li>`).join('');
    });
  }

  $('endGameBtn').addEventListener('click', async () => {
    if (!confirm('¿Terminar la partida y mostrar el podio final?')) return;
    await db.collection('rooms').doc(state.roomCode).update({ status:'finished' });
    const snap = await db.collection('rooms').doc(state.roomCode).collection('players').get();
    const players=[]; snap.forEach(d=>players.push(d.data()));
    players.sort((a,b)=>(b.score||0)-(a.score||0));
    const medals=['🥇','🥈','🥉'];
    $('finalPodium').innerHTML = players.map((p,i)=>`<li><span class="rank">${medals[i]||(i+1)}</span><span class="name">${escapeHtml(p.name)}</span><span class="score">${p.score||0}</span></li>`).join('');
    $('gameScreen').style.display='none'; $('finishScreen').style.display='flex';
    localStorage.removeItem('lastHostRoom');
  });
}

/* ============================================================
   JUGADOR
   ============================================================ */
function renderPlayer(roomCode, playerName){
  app.innerHTML = `
  <div class="wrap narrow">
    <div class="row between" style="margin-bottom:8px;">
      <span class="pill" id="roomPill">Sala ${roomCode}</span>
      <span class="pill" id="myScorePill">0 pts</span>
    </div>

    <section id="waitScreen" class="card center" style="flex-direction:column;gap:10px;min-height:40vh;">
      <span class="eyebrow">¡Estás dentro!</span>
      <h2 class="display" style="text-align:center;">Esperando a que empiece la partida…</h2>
      <p style="color:var(--ink-dim);text-align:center;">El anfitrión controla la música. Prepara el oído 🎧</p>
      <ul class="leaderboard" id="waitPlayerList" style="width:100%;"></ul>
    </section>

    <section id="quizScreen" class="stack" style="display:none;">
      <div class="dial" id="quizDial">
        <div class="tick" data-d="70">70s</div><div class="tick" data-d="80">80s</div><div class="tick" data-d="90">90s</div>
        <div class="tick" data-d="00">00s</div><div class="tick" data-d="10">10s</div><div class="tick" data-d="20">20s</div>
      </div>
      <div class="card stack" id="quizAnswerCard">
        <h3 class="center">🎶 ¿De qué año es?</h3>
        <div class="year-readout" id="yearReadout">1995</div>
        <input type="range" id="yearSlider" min="1970" max="2026" value="1995" step="1">
        <div><label>Artista (opcional, +50 pts si aciertas)</label><input type="text" id="artistInput" placeholder="Escribe el artista si lo sabes"></div>
        <button class="btn-primary btn-block btn-lg" id="submitAnswerBtn">Enviar respuesta</button>
      </div>
      <div class="card center" id="quizWaitingCard" style="display:none;flex-direction:column;gap:8px;">
        <h3>✅ Respuesta enviada</h3><p style="color:var(--ink-dim);">Esperando a que el anfitrión revele la respuesta…</p>
      </div>
      <div class="card stack" id="quizRevealCard" style="display:none;">
        <div class="center" style="flex-direction:column;">
          <span class="eyebrow">Era…</span>
          <h2 class="display" id="quizRevealTitle" style="text-align:center;font-size:20px;"></h2>
          <p style="color:var(--ink-dim);" id="quizRevealMeta"></p>
          <h1 class="display" id="quizPointsEarned" style="font-size:40px;margin-top:8px;"></h1>
        </div>
      </div>
    </section>

    <section id="bingoScreen" class="stack" style="display:none;">
      <div class="dial" id="bingoDial">
        <div class="tick" data-d="70">70s</div><div class="tick" data-d="80">80s</div><div class="tick" data-d="90">90s</div>
        <div class="tick" data-d="00">00s</div><div class="tick" data-d="10">10s</div><div class="tick" data-d="20">20s</div>
      </div>
      <div class="card stack">
        <h3 class="center" id="bingoStatusLine">🎶 Sonando… ¿la tienes en tu cartón?</h3>
        <div class="bingo-card" id="bingoCard"></div>
        <p style="color:var(--ink-dim);font-size:13px;text-align:center;">Toca la casilla que creas que es la canción sonando. Solo se marca si aciertas.</p>
      </div>
      <div class="card stack" id="bingoRevealInfo" style="display:none;">
        <div class="center" style="flex-direction:column;"><span class="eyebrow">Era…</span><h3 id="bingoRevealTitle" style="text-align:center;"></h3></div>
      </div>
    </section>

    <div class="card stack" style="margin-top:14px;"><h3>Marcador</h3><ul class="leaderboard" id="scoreboard"></ul></div>
  </div>`;

  const $ = id => document.getElementById(id);
  let playerId = null, lastRoundNumber = 0, currentMode = 'quiz', myCard = [], hasSubmittedThisRound = false;

  (async function init(){
    await authReady;
    playerId = firebase.auth().currentUser.uid;
    const roomRef = db.collection('rooms').doc(roomCode);
    const roomSnap = await roomRef.get();
    if (!roomSnap.exists) { alert('Esa sala no existe. Comprueba el código con el anfitrión.'); location.search=''; return; }
    const playerRef = roomRef.collection('players').doc(playerId);
    const existing = await playerRef.get();
    if (!existing.exists) await playerRef.set({ name:playerName, score:0, joinedAt:firebase.firestore.FieldValue.serverTimestamp(), card:[] });

    roomRef.collection('players').onSnapshot(snap => {
      const names=[]; snap.forEach(d=>names.push(d.data().name));
      $('waitPlayerList').innerHTML = names.map(n=>`<li><span class="name">${escapeHtml(n)}</span></li>`).join('');
    });
    roomRef.collection('players').onSnapshot(snap => {
      const players=[]; snap.forEach(d=>players.push({id:d.id,...d.data()}));
      players.sort((a,b)=>(b.score||0)-(a.score||0));
      $('scoreboard').innerHTML = players.map((p,i)=>`<li><span class="rank">${i+1}</span><span class="name">${escapeHtml(p.name)}${p.id===playerId?' (tú)':''}</span><span class="score">${p.score||0}</span></li>`).join('');
      const me = players.find(p=>p.id===playerId);
      $('myScorePill').textContent = `${me?(me.score||0):0} pts`;
    });
    playerRef.onSnapshot(snap => {
      const data = snap.data(); if (!data) return;
      myCard = data.card || [];
      if (currentMode === 'bingo') renderBingoCard();
    });

    roomRef.onSnapshot(snap => {
      const room = snap.data(); if (!room) return;
      currentMode = room.mode || 'quiz';
      if (room.status === 'lobby') {
        showScreen('wait');
      } else if (room.status === 'playing') {
        if (currentMode === 'quiz') {
          if (room.roundNumber !== lastRoundNumber) resetQuizInputs();
          showScreen('quiz-answer'); lightDial('quiz', null);
        } else {
          if (room.roundNumber !== lastRoundNumber) renderBingoCard();
          showScreen('bingo');
          $('bingoStatusLine').textContent = '🎶 Sonando… ¿la tienes en tu cartón?';
          $('bingoRevealInfo').style.display = 'none';
          lightDial('bingo', null);
        }
      } else if (room.status === 'reveal') {
        if (currentMode === 'quiz') {
          showScreen('quiz-reveal');
          $('quizRevealTitle').textContent = `${room.currentTrack.title} — ${room.currentTrack.artist}`;
          $('quizRevealMeta').textContent = `Año real: ${room.currentTrack.year}`;
          lightDial('quiz', room.currentTrack.decade);
          showMyRoundPoints(room.roundNumber);
        } else {
          showScreen('bingo');
          $('bingoStatusLine').textContent = '✅ Respuesta revelada';
          $('bingoRevealInfo').style.display = 'block';
          $('bingoRevealTitle').textContent = `${room.currentTrack.title} — ${room.currentTrack.artist} (${room.currentTrack.year})`;
          lightDial('bingo', room.currentTrack.decade);
        }
      } else if (room.status === 'finished') {
        showScreen('wait');
        $('waitScreen').querySelector('h2').textContent = '🏁 Partida terminada. ¡Gracias por jugar!';
      }
      lastRoundNumber = room.roundNumber || 0;
    });
  })();

  function showScreen(name){
    $('waitScreen').style.display = name==='wait'?'flex':'none';
    $('quizScreen').style.display = name.startsWith('quiz')?'flex':'none';
    $('bingoScreen').style.display = name==='bingo'?'flex':'none';
    if (name==='quiz-answer') {
      $('quizAnswerCard').style.display = hasSubmittedThisRound?'none':'flex';
      $('quizWaitingCard').style.display = hasSubmittedThisRound?'flex':'none';
      $('quizRevealCard').style.display = 'none';
    } else if (name==='quiz-reveal') {
      $('quizAnswerCard').style.display='none'; $('quizWaitingCard').style.display='none'; $('quizRevealCard').style.display='flex';
    }
  }

  function lightDial(prefix, decade){
    document.querySelectorAll(`#${prefix}Dial .tick`).forEach(t => t.classList.toggle('lit', decade ? t.dataset.d===decade : false));
  }

  $('yearSlider').addEventListener('input', () => { $('yearReadout').textContent = $('yearSlider').value; });
  function resetQuizInputs(){ hasSubmittedThisRound=false; $('yearSlider').value=1995; $('yearReadout').textContent='1995'; $('artistInput').value=''; }

  $('submitAnswerBtn').addEventListener('click', async () => {
    const roomRef = db.collection('rooms').doc(roomCode);
    const roomSnap = await roomRef.get(); const room = roomSnap.data();
    await roomRef.collection('answers').doc(`${room.roundNumber}_${playerId}`).set({
      playerId, playerName, roundNumber: room.roundNumber,
      guessYear: parseInt($('yearSlider').value,10), guessArtist: $('artistInput').value.trim(),
      submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    hasSubmittedThisRound = true;
    $('quizAnswerCard').style.display='none'; $('quizWaitingCard').style.display='flex';
  });

  async function showMyRoundPoints(roundNumber){
    const doc = await db.collection('rooms').doc(roomCode).collection('answers').doc(`${roundNumber}_${playerId}`).get();
    if (doc.exists && doc.data().scored) $('quizPointsEarned').textContent = `+${doc.data().points||0} pts`;
    else $('quizPointsEarned').textContent = 'No respondiste esta ronda';
  }

  function renderBingoCard(){
    if (!myCard.length) { $('bingoCard').innerHTML = '<p style="color:var(--ink-dim);grid-column:1/-1;text-align:center;">Esperando cartón…</p>'; return; }
    $('bingoCard').innerHTML = myCard.map((c,i)=>`<div class="bingo-cell ${c.marked?'marked':''}" data-i="${i}"><div>${c.year}</div><small>${escapeHtml(c.artist).slice(0,14)}</small></div>`).join('');
    document.querySelectorAll('.bingo-cell').forEach(cell => cell.addEventListener('click', () => onBingoCellTap(parseInt(cell.dataset.i,10))));
  }

  async function onBingoCellTap(index){
    const cell = myCard[index];
    if (!cell || cell.marked) return;
    const roomSnap = await db.collection('rooms').doc(roomCode).get();
    const room = roomSnap.data();
    if (room.status !== 'playing') return;
    if (cell.trackId !== room.currentTrackId) {
      const el = document.querySelector(`.bingo-cell[data-i="${index}"]`);
      if (el) { el.style.transform='scale(.9)'; setTimeout(()=>el.style.transform='',150); }
      return;
    }
    myCard[index].marked = true;
    const playerRef = db.collection('rooms').doc(roomCode).collection('players').doc(playerId);
    const isBingo = checkBingoLine(myCard);
    await playerRef.update({ card: myCard, score: firebase.firestore.FieldValue.increment(20 + (isBingo?100:0)) });
    renderBingoCard();
    if (isBingo) alert('🎉 ¡BINGO! +100 puntos extra');
  }
}
</script>
